---
site:
  title: OpenShift Security Roadshow
  url: https://github.com/rhpds/ocp5-rhacs-showroom
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/jnewsome97/rhdp_showroom_theme_execute/releases/download/rh-one-2025-execute-v4/ui-bundle.zip
    snapshot: true
  # A directory path in this list is not expanded. Name each file.
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: partials/head-meta.hbs
      contents: ./content/supplemental-ui/partials/head-meta.hbs
    - path: partials/footer-scripts.hbs
      contents: ./content/supplemental-ui/partials/footer-scripts.hbs
    - path: css/site-extra.css
      contents: ./content/supplemental-ui/css/site-extra.css
    - path: js/execute-copy.js
      contents: ./content/supplemental-ui/js/execute-copy.js

asciidoc:
  attributes:
    showroom-collection-version: v1.5.2

runtime:
  fetch: true

output:
  dir: ./www
