---
site:
  title: OpenShift Security Roadshow
  url: https://github.com/rhpds/ocp5-rhacs-showroom
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/jnewsome97/rhdp_showroom_theme_execute/releases/download/rh-one-2025-execute-v4/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui

asciidoc:
  attributes:
    showroom-collection-version: v1.5.2

runtime:
  fetch: true

# The Showroom Antora image (quay.io/rhpds/antora:v1.3.0) ships this package
# and does not install playbook dependencies. [mermaid] blocks render only
# when the playbook registers it. header-scripts is the partial this UI includes.
antora:
  extensions:
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true

output:
  dir: ./www
