# Applied after rhacs-virt-webserver exists with the primary-user-defined-network
# label. Selecting that namespace before the label is present leaves this
# network at NetworkCreated=False.
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: webserver
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: ["rhacs-virt-webserver"]
  network:
    topology: Layer2
    layer2:
      role: Primary
      ipam:
        lifecycle: Persistent
      subnets:
        - "192.168.212.0/24"
