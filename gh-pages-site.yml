---
# Antora playbook for GitHub Pages.
# CI overwrites site.url with the Pages base URL from actions/configure-pages.
site:
  title: OpenShift Security Roadshow
  url: https://mfosterrox.github.io/ocp5-rhacs-showroom
  start_page: modules::index.adoc

content:
  sources:
  - url: .
    start_path: content

ui:
  bundle:
    url: https://github.com/jnewsome97/rhdp_showroom_theme_execute/releases/download/rh-one-2025-execute-v4/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

# Same registration as site.yml so GitHub Pages renders [mermaid] blocks.
# The Pages workflow installs @sntke/antora-mermaid-extension. RHDP does not;
# that image already contains the package.
antora:
  extensions:
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true

output:
  dir: ./www
